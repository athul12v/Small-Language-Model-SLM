<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLM Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #131314;
      --bg-surface: #1e1f20;
      --bg-user-bubble: #2b2c2f;
      --bg-input: #1e1f20;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.2);
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent: #a8c7fa;
      --accent-hover: #c2e7ff;
      --tag-green: #6dd58c;
      --tag-yellow: #fdd663;
      --tag-red: #f28b82;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-size: 14.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav */
    .top-nav {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(19, 19, 20, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      flex-shrink: 0;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
      cursor: default;
    }

    .model-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .new-chat-btn:hover {
      background: var(--bg-surface);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Chat Messages Stream */
    .chat-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 100px 12px;
      scroll-behavior: smooth;
    }

    .conversation-thread {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message Rows */
    .msg-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .user-bubble {
      background: var(--bg-user-bubble);
      color: #ffffff;
      padding: 9px 15px;
      border-radius: 18px;
      border-bottom-right-radius: 4px;
      max-width: 82%;
      font-size: 14.5px;
      word-break: break-word;
      line-height: 1.45;
    }

    .msg-row.assistant {
      justify-content: flex-start;
      gap: 12px;
    }

    .assistant-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(168, 199, 250, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .assistant-body {
      flex: 1;
      max-width: calc(100% - 40px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 4px;
      width: fit-content;
    }
    .status-tag.success { color: var(--tag-green); background: rgba(109, 213, 140, 0.12); }
    .status-tag.missing, .status-tag.clarification { color: var(--tag-yellow); background: rgba(253, 214, 99, 0.12); }
    .status-tag.insufficient, .status-tag.error { color: var(--tag-red); background: rgba(242, 139, 130, 0.12); }

    .assistant-text {
      font-size: 14.5px;
      color: var(--text-main);
      line-height: 1.6;
      word-break: break-word;
    }

    .clarification-callout {
      padding: 8px 12px;
      border-left: 2.5px solid var(--tag-yellow);
      background: rgba(253, 214, 99, 0.08);
      border-radius: 0 6px 6px 0;
      font-size: 13.5px;
      color: #ffe082;
    }

    /* Compact Sources Accordion */
    .sources-accordion {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      overflow: hidden;
      margin-top: 4px;
      font-size: 12.5px;
    }
    .sources-btn {
      width: 100%;
      padding: 6px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .sources-btn:hover { color: var(--text-main); }
    .sources-list {
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.15);
    }
    .sources-list.open { display: flex; }
    .source-entry {
      padding-left: 8px;
      border-left: 2px solid var(--accent);
    }
    .source-entry-title { font-weight: 600; color: var(--accent); font-size: 12px; }
    .source-entry-content { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }

    /* Welcome / Starter chips */
    .welcome-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .welcome-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .welcome-desc {
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Bottom Input Bar (Floating Capsule like ChatGPT/Gemini) */
    .input-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent 0%, var(--bg-app) 40%);
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .input-box {
      width: 100%;
      max-width: 760px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 4px 6px 4px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      padding: 8px 0;
    }
    .chat-input::placeholder { color: var(--text-muted); }

    .send-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #131314;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .send-icon-btn:hover { opacity: 0.9; transform: scale(1.04); }
    .send-icon-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    .legal-hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Typing Animation */
    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 6px 0;
    }
    .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Top Slim Bar -->
  <header class="top-nav">
    <div class="model-selector">
      <span>SLM Enterprise</span>
      <span class="model-pill">Qwen2.5-0.5B • Guarded</span>
    </div>
    <button id="clear-btn" class="new-chat-btn" title="Start new conversation">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
      <span>New chat</span>
    </button>
  </header>

  <!-- Messages Container -->
  <main class="chat-scroll-area">
    <div id="thread" class="conversation-thread">
      <div class="welcome-container">
        <div class="welcome-title">Enterprise Assistant</div>
        <div class="welcome-desc">Answers employee questions grounded strictly in verified company policies. If details are missing or contradictory, it clarifies instead of guessing.</div>
        <div class="starter-chips">
          <button class="chip" onclick="quickAsk('Where can I find our brand guidelines and slide templates?')">Brand Guidelines</button>
          <button class="chip" onclick="quickAsk('Can I roll over unused PTO days into next year?')">PTO Rollover</button>
          <button class="chip" onclick="quickAsk('What is the daily domestic travel meal per diem?')">Meal Per Diem</button>
          <button class="chip" onclick="quickAsk('What is our policy on contributing to open-source software?')">Open Source</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Fixed Bottom Input -->
  <div class="input-dock">
    <form id="chat-form" class="input-box" onsubmit="handleSend(event)">
      <input 
        type="text" 
        id="user-input" 
        class="chat-input" 
        placeholder="Ask about company policies, benefits, travel, or IT..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="send-btn" class="send-icon-btn" aria-label="Send message">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
    <div class="legal-hint">SLM Enterprise is grounded in internal policies and guarded by the AI Harness.</div>
  </div>

  <script>
    let sessionId = "sess_" + Math.random().toString(36).substring(2, 9);
    const thread = document.getElementById("thread");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    document.getElementById("clear-btn").addEventListener("click", () => {
      sessionId = "sess_" + Math.random().toString(36).substring(2, 9);
      fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId })
      }).catch(() => {});

      thread.innerHTML = `
        <div class="welcome-container">
          <div class="welcome-title">Enterprise Assistant</div>
          <div class="welcome-desc">New chat started. What enterprise policy or guideline can I help you find?</div>
          <div class="starter-chips">
            <button class="chip" onclick="quickAsk('Where can I find our brand guidelines and slide templates?')">Brand Guidelines</button>
            <button class="chip" onclick="quickAsk('Can I roll over unused PTO days into next year?')">PTO Rollover</button>
            <button class="chip" onclick="quickAsk('What is the daily domestic travel meal per diem?')">Meal Per Diem</button>
          </div>
        </div>
      `;
      input.focus();
    });

    function quickAsk(text) {
      input.value = text;
      input.focus();
    }

    async function handleSend(e) {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      appendUserMsg(q);
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      const typingId = showTyping();
      scrollToBottom();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q, session_id: sessionId })
        });
        const data = await res.json();
        removeTyping(typingId);
        appendAssistantMsg(data);
      } catch (err) {
        removeTyping(typingId);
        appendAssistantMsg({ status: "error", answer: "Connection error: " + err.message });
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    function appendUserMsg(text) {
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
      thread.appendChild(row);
    }

    function appendAssistantMsg(data) {
      const row = document.createElement("div");
      row.className = "msg-row assistant";

      let tagClass = "success";
      let tagLabel = "● Verified";
      if (data.status === "missing_information") { tagClass = "missing"; tagLabel = "● Missing Info"; }
      else if (data.status === "clarification_required") { tagClass = "clarification"; tagLabel = "● Clarification"; }
      else if (data.status === "insufficient_evidence") { tagClass = "insufficient"; tagLabel = "● Insufficient Evidence"; }
      else if (data.status === "validation_error" || data.status === "error") { tagClass = "error"; tagLabel = "● Blocked"; }

      let clarificationHtml = data.follow_up_question ? `
        <div class="clarification-callout">
          <strong>Clarification needed:</strong> ${escapeHtml(data.follow_up_question)}
        </div>
      ` : "";

      let sourcesHtml = "";
      if (data.sources && data.sources.length > 0) {
        const items = data.sources.map((s, idx) => `
          <div class="source-entry">
            <div class="source-entry-title">Source ${idx + 1}: ${escapeHtml(s.instruction || "Policy Record")}</div>
            <div class="source-entry-content">${escapeHtml(s.input || "")}</div>
          </div>
        `).join("");

        sourcesHtml = `
          <div class="sources-accordion">
            <button class="sources-btn" onclick="toggleSources(this)">
              <span>📚 Supporting Documents (${data.sources.length})</span>
              <span>▾</span>
            </button>
            <div class="sources-list">${items}</div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="assistant-icon">✦</div>
        <div class="assistant-body">
          <div><span class="status-tag ${tagClass}">${tagLabel}</span></div>
          ${data.answer ? `<div class="assistant-text">${escapeHtml(data.answer)}</div>` : ""}
          ${clarificationHtml}
          ${sourcesHtml}
        </div>
      `;
      thread.appendChild(row);
    }

    function toggleSources(btn) {
      const list = btn.nextElementSibling;
      const isOpen = list.classList.toggle("open");
      btn.querySelector("span:last-child").textContent = isOpen ? "▴" : "▾";
    }

    function showTyping() {
      const id = "typing-" + Date.now();
      const row = document.createElement("div");
      row.id = id;
      row.className = "msg-row assistant";
      row.innerHTML = `
        <div class="assistant-icon">✦</div>
        <div class="assistant-body">
          <div class="typing-dots">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      thread.appendChild(row);
      return id;
    }

    function removeTyping(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function scrollToBottom() {
      const container = document.querySelector(".chat-scroll-area");
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(t) {
      if (!t) return "";
      const div = document.createElement("div");
      div.textContent = t;
      return div.innerHTML;
    }
  </script>
</body>
</html>
